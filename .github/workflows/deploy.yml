name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hms_install_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, bcmath
          coverage: none

      - name: Install PHP packages
        run: composer install --prefer-dist --no-interaction --no-progress

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        run: npm ci && npm run build

      - name: Run tests
        env:
          MYSQL_TEST_HOST: 127.0.0.1
          MYSQL_TEST_PORT: 3306
          MYSQL_TEST_DATABASE: hms_install_test
          MYSQL_TEST_USERNAME: root
          MYSQL_TEST_PASSWORD: root
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      APP_URL: ${{ vars.APP_URL || 'https://hms.ferasolution.com' }}
    steps:
      - name: Check deploy secrets
        id: check
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ]; then
            echo "::notice::Deploy skipped: add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD in Settings > Secrets > Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.ready == 'true'

      - uses: shivammathur/setup-php@v2
        if: steps.check.outputs.ready == 'true'
        with:
          php-version: '8.3'
          coverage: none

      - name: Install production PHP packages
        if: steps.check.outputs.ready == 'true'
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        if: steps.check.outputs.ready == 'true'
        run: npm ci && npm run build

      - name: Prepare writable folders and installer key
        if: steps.check.outputs.ready == 'true'
        env:
          INSTALL_KEY: ${{ secrets.INSTALL_KEY || secrets.FTP_PASSWORD }}
        run: |
          # The web installer (/install) asks for INSTALL_KEY (or, if that secret is not set, the
          # FTP password) and checks it against this hash. Surrounding spaces/newlines are ignored.
          # The file lives in storage/, outside the public web root, and is deleted once installed.
          mkdir -p storage/app
          php -r 'echo hash("sha256", "hms-install:" . trim(getenv("INSTALL_KEY")));' > storage/app/install.key

          # FTP skips empty folders, so put a marker file in each one Laravel writes to.
          rm -f bootstrap/cache/*.php
          for d in storage/app/public storage/framework/cache/data storage/framework/sessions \
                   storage/framework/views storage/logs bootstrap/cache; do
            mkdir -p "$d" && touch "$d/.keep"
          done

      - name: Package release
        if: steps.check.outputs.ready == 'true'
        run: |
          # One zip instead of thousands of FTP uploads (Bluehost's FTPS drops long transfers).
          zip -qr release.zip . \
            -x '.git/*' '.github/*' 'node_modules/*' 'tests/*' 'deploy/*' \
               '.env' '.env.backup' '.env.production' 'release.zip'
          ls -lh release.zip

          # A random key for this run only; the unpacker accepts nothing else.
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "UNPACK_KEY=$key" >> "$GITHUB_ENV"
          hash=$(printf '%s' "$key" | sha256sum | cut -d' ' -f1)
          sed "s/__KEY_HASH__/$hash/" deploy/unpack.php > deploy-unpack.php

      - name: Upload over FTPS
        if: steps.check.outputs.ready == 'true'
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          dir="${FTP_SERVER_DIR:-}"
          dir="${dir#./}"
          base="ftp://$FTP_SERVER/${dir}"
          up() {
            for attempt in 1 2 3 4 5; do
              if curl -sS --ssl-reqd --insecure --ftp-create-dirs --ftp-pasv --retry 3 --connect-timeout 30 \
                   --user "$FTP_USERNAME:$FTP_PASSWORD" -T "$1" "$base$2"; then
                echo "Uploaded $2"; return 0
              fi
              echo "Upload of $2 failed (attempt $attempt), retrying…"; sleep $((attempt * 5))
            done
            return 1
          }
          up release.zip release.zip
          up deploy-unpack.php public/deploy-unpack.php

      - name: Unpack on the server
        if: steps.check.outputs.ready == 'true'
        run: |
          code=$(curl -sS -o unpack.json -w '%{http_code}' -X POST \
            -A "Mozilla/5.0 (compatible; FeraHealthDeploy/1.0; +https://github.com/ferasolution/hms)" \
            -H "Accept: application/json" -H "Content-Type: application/json" \
            -H "X-Deploy-Key: $UNPACK_KEY" --data '{"source":"github-actions"}' \
            --max-time 300 "$APP_URL/deploy-unpack.php")
          cat unpack.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::Unpacking failed with HTTP $code. Check that the subdomain's document root is the site folder or its public/ folder, and that PHP 8.3+ with the zip extension is enabled."
            exit 1
          fi

      - name: Run migrations and rebuild caches
        if: steps.check.outputs.ready == 'true'
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::notice::Files uploaded. Finish setup at $APP_URL/install, then save the token it shows as the DEPLOY_TOKEN secret."
            exit 0
          fi
          # Bluehost's Mod_Security blocks curl's default user agent and empty POSTs,
          # so send a named user agent and a small JSON body.
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            -A "Mozilla/5.0 (compatible; FeraHealthDeploy/1.0; +https://github.com/ferasolution/hms)" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" \
            --data '{"source":"github-actions"}' \
            "$APP_URL/api/deploy-hook")
          python3 -m json.tool response.json 2>/dev/null || cat response.json
          case "$code" in
            200) echo "Deploy hook finished." ;;
            404) echo "::warning::Site is not installed yet. Open $APP_URL/install." ;;
            403) echo "::error::DEPLOY_TOKEN in GitHub does not match the one on the server."; exit 1 ;;
            *)   echo "::error::Deploy hook failed with HTTP $code."; exit 1 ;;
          esac
